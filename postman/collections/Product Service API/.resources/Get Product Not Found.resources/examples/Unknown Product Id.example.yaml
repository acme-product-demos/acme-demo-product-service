$kind: http-example
name: Unknown Product Id
request:
  url: '{{baseUrl}}/api/products/does-not-exist'
  method: GET
response:
  statusCode: 404
  statusText: Not Found
  headers:
    - key: Content-Type
      value: application/json
  body:
    type: json
    content: |-
      {
        "error": "Product not found"
      }
order: 1000
