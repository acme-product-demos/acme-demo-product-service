$kind: http-request
method: GET
url: '{{baseUrl}}/api/products/{{sampleProductId}}'
order: 4000
headers:
  - key: Accept
    value: application/json
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('status is 200', function () {
        pm.response.to.have.status(200);
      });

      pm.test('returned product id matches the requested sampleProductId', function () {
        var body = pm.response.json();
        pm.expect(body.id).to.eql(pm.collectionVariables.get('sampleProductId'));
      });
