openapi: 3.0.3
info:
  title: Product Service API
  version: 0.1.0
  description: >-
    Read-only catalog service for products. Backed by in-memory data with 10
    seeded products (ids p1..p10).
  contact:
    name: acme-corp demo team
    email: avinash.choudhary@postman.com
    url: https://github.com/acme-product-demos/acme-demo-product-service
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
servers:
  - url: http://localhost:4001
    description: Local development server
tags:
  - name: Health
    description: Service health checks
  - name: Products
    description: Product catalog operations
paths:
  /health:
    get:
      tags:
        - Health
      summary: Health check
      description: Returns the service's health status.
      operationId: getHealth
      responses:
        '200':
          description: Service is healthy.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
              example:
                status: ok
                service: product-service
  /api/products:
    get:
      tags:
        - Products
      summary: List products
      description: >-
        Returns all products, optionally filtered by category
        (case-insensitive exact match).
      operationId: listProducts
      parameters:
        - name: category
          in: query
          required: false
          description: Filter products by category, case-insensitive exact match.
          schema:
            type: string
          example: electronics
      responses:
        '200':
          description: Array of products matching the optional category filter.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Product'
              example:
                - id: p1
                  name: Wireless Noise-Cancelling Headphones
                  description: Over-ear Bluetooth headphones with active noise cancellation and 30-hour battery life.
                  price: 149.99
                  category: electronics
                  image: 🎧
                  stock: 42
                - id: p2
                  name: Smart Fitness Watch
                  description: Tracks heart rate, sleep, and workouts with a 7-day battery and always-on display.
                  price: 199.00
                  category: electronics
                  image: ⌚
                  stock: 30
                - id: p3
                  name: Ceramic Pour-Over Coffee Set
                  description: Hand-glazed ceramic dripper and carafe for a smooth, rich cup of coffee.
                  price: 39.50
                  category: home
                  image: ☕
                  stock: 65
                - id: p4
                  name: Memory Foam Throw Pillow
                  description: Plush 18-inch decorative pillow with a removable, machine-washable cover.
                  price: 24.99
                  category: home
                  image: 🛋️
                  stock: 120
                - id: p5
                  name: Men's Merino Wool Sweater
                  description: Lightweight, breathable crewneck sweater made from 100% merino wool.
                  price: 79.00
                  category: apparel
                  image: 🧥
                  stock: 55
                - id: p6
                  name: Women's Running Sneakers
                  description: Cushioned lightweight sneakers designed for daily runs and long walks.
                  price: 89.99
                  category: apparel
                  image: 👟
                  stock: 73
                - id: p7
                  name: The Midnight Orchard (Novel)
                  description: A bestselling mystery novel set in a small coastal town with a dark secret.
                  price: 14.99
                  category: books
                  image: 📖
                  stock: 200
                - id: p8
                  name: "Learn Cooking: A Beginner's Guide"
                  description: Step-by-step recipes and techniques for building confidence in the kitchen.
                  price: 22.50
                  category: books
                  image: 📚
                  stock: 88
                - id: p9
                  name: Stainless Steel Water Bottle
                  description: Insulated 24oz bottle that keeps drinks cold for 24 hours or hot for 12.
                  price: 27.00
                  category: home
                  image: 🍶
                  stock: 150
                - id: p10
                  name: Portable Bluetooth Speaker
                  description: Compact waterproof speaker with rich bass and 12-hour playtime.
                  price: 59.99
                  category: electronics
                  image: 🔊
                  stock: 47
  /api/products/{id}:
    get:
      tags:
        - Products
      summary: Get product by id
      description: Returns a single product by its id.
      operationId: getProductById
      parameters:
        - name: id
          in: path
          required: true
          description: Product identifier, e.g. p1.
          schema:
            type: string
          example: p1
      responses:
        '200':
          description: The requested product.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
              example:
                id: p1
                name: Wireless Noise-Cancelling Headphones
                description: Over-ear Bluetooth headphones with active noise cancellation and 30-hour battery life.
                price: 149.99
                category: electronics
                image: 🎧
                stock: 42
        '404':
          description: No product exists with the given id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundError'
              example:
                error: Product not found
components:
  schemas:
    HealthStatus:
      type: object
      required:
        - status
        - service
      properties:
        status:
          type: string
          example: ok
        service:
          type: string
          example: product-service
    Product:
      type: object
      required:
        - id
        - name
        - description
        - price
        - category
        - image
        - stock
      properties:
        id:
          type: string
          description: Unique product identifier.
          example: p1
        name:
          type: string
          description: Product display name.
          example: Wireless Noise-Cancelling Headphones
        description:
          type: string
          description: Longer descriptive text for the product.
          example: >-
            Over-ear Bluetooth headphones with active noise cancellation and
            30-hour battery life.
        price:
          type: number
          description: Price in USD.
          example: 149.99
        category:
          type: string
          description: Product category.
          example: electronics
        image:
          type: string
          description: Emoji or image reference representing the product.
          example: 🎧
        stock:
          type: integer
          description: Units currently in stock.
          example: 42
    NotFoundError:
      type: object
      required:
        - error
      properties:
        error:
          type: string
          example: Product not found
